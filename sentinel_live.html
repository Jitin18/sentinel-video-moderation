<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel — Agentic Multimodal Video Moderation</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js?v=classic1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a10;--bg-2:#090d15;--panel:#0e131d;--panel-2:#121826;--panel-3:#161d2d;
    --line:#1c2435;--line-2:#27314a;--ink:#eaf1f8;--muted:#8295ae;--muted-2:#4a5870;
    --safe:#28e0a8;--safe-2:#0e3b30;--flag:#ff3d63;--flag-2:#3d101e;--warn:#ffc24d;
    --accent:#5f8cff;--accent-2:#13213d;--violet:#a06bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:52px 52px;opacity:.18;mask-image:radial-gradient(ellipse 110% 60% at 50% 0%,#000 30%,transparent 75%)}
  .bg-glow-1{background:radial-gradient(circle 700px at 12% 4%,rgba(95,140,255,.10),transparent 55%)}
  .bg-glow-2{background:radial-gradient(circle 600px at 92% 30%,rgba(160,107,255,.07),transparent 55%)}
  #root{position:relative;z-index:1}

  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:15px 32px;border-bottom:1px solid var(--line);background:rgba(9,13,21,.82);backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{width:38px;height:38px;border-radius:11px;position:relative;flex-shrink:0;background:conic-gradient(from 220deg,#5f8cff,#28e0a8,#a06bff,#5f8cff);box-shadow:0 0 26px rgba(95,140,255,.45),inset 0 0 12px rgba(0,0,0,.4)}
  .brand-mark::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
  .brand-mark::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;border-bottom-color:transparent;animation:spin 2.4s cubic-bezier(.6,.1,.4,.9) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:21px;letter-spacing:3px}
  .brand-name b{background:linear-gradient(90deg,#5f8cff,#28e0a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand-sub{font-size:9.5px;color:var(--muted-2);letter-spacing:3.5px;text-transform:uppercase;margin-top:2px}
  .topbar-spacer{flex:1}
  .stat-chip{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-family:'IBM Plex Mono'}
  .stat-chip .dot{width:7px;height:7px;border-radius:50%}
  .dot.live{background:var(--safe);box-shadow:0 0 9px var(--safe);animation:blink 1.5s ease-in-out infinite}
  .dot.off{background:var(--flag);box-shadow:0 0 9px var(--flag)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .stat-chip .lbl{color:var(--muted-2);text-transform:uppercase;letter-spacing:1px;font-size:9.5px}
  .gpu-chip .meter{width:80px;height:6px;border-radius:4px;background:var(--bg);overflow:hidden;position:relative;border:1px solid var(--line)}
  .gpu-chip .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--safe));transition:width .9s ease}
  .gpu-chip .meter::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:sheen 2.2s linear infinite}
  @keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(200%)}}

  .wrap{max-width:1640px;margin:0 auto;padding:26px 32px 60px}
  .banner{margin:0 0 22px;padding:12px 18px;border-radius:11px;font-family:'IBM Plex Mono';font-size:12.5px;display:none;align-items:center;gap:10px}
  .banner.show{display:flex}
  .banner.err{background:var(--flag-2);color:var(--flag);border:1px solid #7a2236}
  .banner.info{background:var(--accent-2);color:var(--accent);border:1px solid #25406e}

  /* ===== DEMO PICKER ===== */
  .picker{display:grid;grid-template-columns:1fr auto;gap:16px;margin-bottom:24px;align-items:end}
  @media(max-width:980px){.picker{grid-template-columns:1fr}}
  .clip-select-wrap{display:flex;flex-direction:column;gap:7px}
  .clip-select-label{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-2)}
  .clip-select-shell{position:relative}
  .clip-select{width:100%;appearance:none;-webkit-appearance:none;font-family:'Space Grotesk';font-size:14px;font-weight:500;color:var(--ink);background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line-2);border-radius:13px;padding:15px 44px 15px 18px;cursor:pointer;transition:.18s;outline:none}
  .clip-select:hover{border-color:var(--accent)}
  .clip-select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 28px -10px rgba(95,140,255,.6)}
  .clip-select option{background:var(--panel-2);color:var(--ink)}
  .clip-select-caret{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:13px;pointer-events:none}
  .upload-btn{display:inline-flex;align-items:center;gap:9px;align-self:flex-end;font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--ink);background:var(--panel-3);border:1px solid var(--line-2);border-radius:13px;padding:14px 20px;cursor:pointer;transition:.18s;height:fit-content}
  .upload-btn:hover{border-color:var(--accent);color:var(--accent)}
  .upload-btn-ico{font-size:15px}
  .demo-card{display:flex;align-items:center;gap:15px;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel-2));cursor:pointer;transition:.2s;position:relative;overflow:hidden}
  .demo-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .demo-card.harm::before{background:var(--flag)}
  .demo-card.safe::before{background:var(--safe)}
  .demo-card:hover{transform:translateY(-3px);border-color:var(--line-2)}
  .demo-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 30px -8px rgba(95,140,255,.5)}
  .demo-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--line)}
  .demo-card.harm .demo-ico{background:var(--flag-2);border-color:#7a2236}
  .demo-card.safe .demo-ico{background:var(--safe-2);border-color:#1a5a48}
  .demo-body{flex:1;min-width:0}
  .demo-title{font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-bottom:3px}
  .demo-desc{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono'}
  .demo-pick{font-size:10px;font-family:'IBM Plex Mono';color:var(--muted-2);letter-spacing:1px;text-transform:uppercase;margin-top:5px}
  .demo-card.active .demo-pick{color:var(--accent)}
  .upload-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 26px;border-radius:16px;border:1px dashed var(--line-2);background:var(--panel);cursor:pointer;transition:.2s;min-width:150px}
  .upload-card:hover{border-color:var(--accent);background:var(--accent-2)}
  .upload-ico{font-size:22px;opacity:.8}
  .upload-text{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);text-align:center;letter-spacing:.5px}
  .upload-text b{color:var(--accent);display:block;font-size:12px;margin-bottom:2px}

  .hero{display:grid;grid-template-columns:1.75fr 1fr;gap:24px;margin-bottom:24px}
  @media(max-width:1200px){.hero{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 24px 50px -30px rgba(0,0,0,.85)}
  .card-h{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--line);position:relative}
  .card-h::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet))}
  .card-h .ey{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .card-h .ix{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted-2);margin-left:auto}

  .screen{position:relative;aspect-ratio:16/9;background:radial-gradient(ellipse at center,#0a0f18,#05080d);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .screen-vignette{position:absolute;inset:0;box-shadow:inset 0 0 140px rgba(0,0,0,.65);pointer-events:none;z-index:2}
  .frame-art{font-size:64px;opacity:.1;z-index:1}
  .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 26px 4px var(--accent);opacity:0;top:0;z-index:3}
  .scanning .scanline{animation:scan 2.4s cubic-bezier(.5,0,.5,1) infinite;opacity:1}
  @keyframes scan{0%{top:3%}50%{top:97%}100%{top:3%}}
  .scan-tint{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(180deg,rgba(95,140,255,.05),transparent 40%);transition:.3s}
  .scanning .scan-tint{opacity:1}
  .reticle{position:absolute;width:46px;height:46px;pointer-events:none;opacity:.55;z-index:3}
  .reticle::before,.reticle::after{content:"";position:absolute;background:var(--accent)}
  .reticle.tl{top:16px;left:16px}.reticle.tr{top:16px;right:16px}.reticle.bl{bottom:16px;left:16px}.reticle.br{bottom:16px;right:16px}
  .reticle::before{width:15px;height:2px;top:0;left:0}.reticle::after{width:2px;height:15px;top:0;left:0}
  .reticle.tr::before{left:auto;right:0}.reticle.tr::after{left:auto;right:0}
  .reticle.bl::before{top:auto;bottom:0}.reticle.bl::after{top:auto;bottom:0}
  .reticle.br::before{top:auto;bottom:0;left:auto;right:0}.reticle.br::after{top:auto;bottom:0;left:auto;right:0}
  .screen-tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono';font-size:11px;color:var(--ink);background:rgba(5,8,13,.8);padding:6px 14px;border-radius:8px;border:1px solid var(--line);letter-spacing:.5px;white-space:nowrap;z-index:4}
  .screen-status{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono';font-size:12px;padding:7px 16px;border-radius:9px;display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;animation:fade .3s;z-index:4}
  .play-cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;z-index:5}
  .play-btn{width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,var(--accent),#3f6fe0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(95,140,255,.4),0 0 48px rgba(95,140,255,.55);transition:.2s;position:relative}
  .play-cta:hover .play-btn{transform:scale(1.08);box-shadow:0 0 0 1px rgba(95,140,255,.6),0 0 68px rgba(95,140,255,.75)}
  .play-btn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--accent);opacity:.4;animation:ring 2s ease-out infinite}
  @keyframes ring{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.5);opacity:0}}
  .play-tri{width:0;height:0;border-top:15px solid transparent;border-bottom:15px solid transparent;border-left:24px solid #fff;margin-left:6px}
  .play-label{font-family:'IBM Plex Mono';font-size:13px;color:var(--ink);letter-spacing:1px}
  .play-label b{color:var(--accent)}

  .timeline-card{margin-bottom:24px}
  .timeline-wrap{padding:20px 24px 22px}
  .tl-labels{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted-2);margin-bottom:12px;letter-spacing:.5px}
  .tl-labels .mid{display:flex;align-items:center;gap:7px;letter-spacing:2px;color:var(--muted)}
  .tl{display:flex;gap:6px;height:64px}
  .seg{flex:1;border-radius:9px;background:var(--panel-3);border:1px solid var(--line);position:relative;cursor:default;transition:transform .18s,box-shadow .18s,border-color .3s;overflow:hidden}
  .seg.clickable{cursor:pointer}
  .seg.clickable:hover{transform:translateY(-4px)}
  .seg.pending{background:repeating-linear-gradient(45deg,var(--panel-3),var(--panel-3) 8px,#1a2334 8px,#1a2334 16px)}
  .seg.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 26px rgba(95,140,255,.45)}
  .seg.active::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(95,140,255,.18),transparent);animation:pulseSeg 1s ease-in-out infinite}
  @keyframes pulseSeg{0%,100%{opacity:.4}50%{opacity:1}}
  .seg.safe{background:linear-gradient(180deg,var(--safe-2),#081c17);border-color:#1a5a48}
  .seg.flag{background:linear-gradient(180deg,var(--flag-2),#1d0810);border-color:#7a2236}
  .seg.flag.sel{box-shadow:0 0 0 2px var(--flag),0 0 26px rgba(255,61,99,.4)}
  .seg.safe.sel{box-shadow:0 0 0 2px var(--safe),0 0 26px rgba(40,224,168,.4)}
  .seg .tnum{position:absolute;top:7px;left:9px;font-family:'IBM Plex Mono';font-size:10px;color:rgba(234,241,248,.5);font-weight:600}
  .seg .trange{position:absolute;bottom:7px;left:9px;font-family:'IBM Plex Mono';font-size:9px;color:rgba(234,241,248,.4)}
  .seg .ico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
  .seg .sev{position:absolute;left:0;right:0;bottom:0;height:4px}
  .seg.flag .sev{background:var(--flag);box-shadow:0 0 10px var(--flag)}
  .seg.safe .sev{background:var(--safe);box-shadow:0 0 10px var(--safe)}

  .controls{display:flex;gap:13px;padding:0 24px 22px;align-items:center}
  .clip-now{flex:1;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted)}
  .clip-now b{color:var(--ink)}
  .btn-run{font-family:'Space Grotesk';font-weight:600;font-size:14px;border-radius:11px;border:1px solid #3f6fe0;background:linear-gradient(180deg,var(--accent),#3f6fe0);color:#fff;padding:13px 28px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s;box-shadow:0 0 26px -6px rgba(95,140,255,.6);white-space:nowrap}
  .btn-run:hover:not(:disabled){filter:brightness(1.12);box-shadow:0 0 34px -4px rgba(95,140,255,.8)}
  .btn-run:disabled{opacity:.55;cursor:default}
  .btn-run .spin-i{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .btn-ghost{font-family:'Space Grotesk';font-weight:600;font-size:14px;border-radius:11px;border:1px solid var(--line-2);background:linear-gradient(180deg,var(--panel-3),var(--panel-2));color:var(--ink);padding:13px 24px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn-ghost:hover{border-color:var(--accent)}

  .agents{display:flex;flex-direction:column;gap:13px;padding:20px;position:relative}
  .agent-line{position:absolute;left:39px;top:64px;bottom:60px;width:2px;background:var(--line);z-index:0}
  .agent-line i{position:absolute;left:0;top:0;width:100%;background:linear-gradient(var(--accent),var(--safe));transition:height .5s ease;border-radius:2px;box-shadow:0 0 8px var(--accent)}
  .agent{display:flex;align-items:center;gap:15px;padding:16px 18px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);transition:.3s;position:relative;z-index:1}
  .agent.on{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-2),var(--panel-2));box-shadow:0 0 30px -6px rgba(95,140,255,.5)}
  .agent.done{border-color:#1a5a48;background:linear-gradient(180deg,rgba(14,59,48,.4),var(--panel-2))}
  .agent-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--bg);border:1px solid var(--line);flex-shrink:0;transition:.3s}
  .agent.on .agent-ico{border-color:var(--accent);box-shadow:0 0 20px -2px rgba(95,140,255,.6);animation:bob 1s ease-in-out infinite}
  .agent.done .agent-ico{border-color:#1a5a48}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .agent-body{flex:1;min-width:0}
  .agent-name{font-family:'Space Grotesk';font-weight:600;font-size:15px}
  .agent-state{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono';margin-top:3px;transition:.3s}
  .agent.on .agent-state{color:var(--accent)}
  .agent.done .agent-state{color:var(--safe)}
  .agent-tick{font-size:17px;color:var(--muted-2);width:20px;text-align:center}
  .agent.done .agent-tick{color:var(--safe)}
  .agent.on .agent-tick{color:var(--accent)}

  .metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  @media(max-width:780px){.metrics-row{grid-template-columns:repeat(2,1fr)}}
  .metric-card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden}
  .metric-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;opacity:.7}
  .metric-card.c1::before{background:var(--accent)}.metric-card.c2::before{background:var(--flag)}
  .metric-card.c3::before{background:var(--violet)}.metric-card.c4::before{background:var(--safe)}
  .metric-card .mlabel{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-bottom:10px}
  .metric-card .mval{font-family:'IBM Plex Mono';font-weight:700;font-size:32px;letter-spacing:-1px;line-height:1}
  .metric-card .msub{font-size:11px;color:var(--muted-2);font-family:'IBM Plex Mono';margin-top:6px}

  .verdict-card .card-h{padding:18px 24px}
  .verdict{padding:26px}
  .verdict.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-2);font-size:14px;font-family:'IBM Plex Mono';text-align:center;gap:14px;min-height:260px}
  .empty-ico{font-size:38px;opacity:.3}
  .vd-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:28px}
  @media(max-width:1000px){.vd-grid{grid-template-columns:1fr}}
  .vd-top{display:flex;align-items:center;gap:13px;margin-bottom:18px}
  .vd-badge{font-family:'IBM Plex Mono';font-weight:700;font-size:13px;padding:9px 16px;border-radius:9px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .vd-badge.flag{background:var(--flag-2);color:var(--flag);border:1px solid #7a2236;box-shadow:0 0 22px -8px var(--flag)}
  .vd-badge.safe{background:var(--safe-2);color:var(--safe);border:1px solid #1a5a48}
  .vd-badge .bdot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .vd-sev{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);margin-left:auto}
  .vd-policy{font-family:'Space Grotesk';font-weight:700;font-size:28px;letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .vd-policy .cat{font-size:11px;font-family:'IBM Plex Mono';color:var(--flag);background:var(--flag-2);padding:4px 10px;border-radius:6px;letter-spacing:1px;font-weight:600}
  .vd-policy-name{font-size:14px;color:var(--muted);margin-bottom:22px}
  .vd-conf{margin-bottom:22px}
  .vd-conf-lab{display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:1px}
  .vd-conf-lab b{color:var(--ink);font-size:15px}
  .vd-conf-bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;position:relative;border:1px solid var(--line)}
  .vd-conf-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--warn),var(--flag));transition:width 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px -2px var(--flag)}
  .vd-rag{margin-bottom:16px;padding:13px 15px;background:rgba(95,140,255,.06);border:1px solid var(--accent-2);border-radius:10px}
  .vd-rag-h{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .vd-rag-h .cnt{margin-left:auto;color:var(--muted)}
  .vd-rag-chips{display:flex;flex-wrap:wrap;gap:6px}
  .rag-chip{font-family:'IBM Plex Mono';font-size:10.5px;padding:4px 9px;border-radius:6px;background:var(--panel-3);border:1px solid var(--line);color:var(--muted)}
  .rag-chip.hit{background:var(--accent-2);border-color:var(--accent);color:var(--accent);font-weight:600}
  .vd-interplay{display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono';font-size:12px;color:var(--violet);background:rgba(160,107,255,.1);border:1px solid rgba(160,107,255,.3);padding:9px 15px;border-radius:9px;margin-bottom:22px;font-weight:500}
  .vd-interplay .gem{color:var(--violet);animation:gemPulse 2s ease-in-out infinite}
  @keyframes gemPulse{0%,100%{opacity:1}50%{opacity:.4}}
  .vd-reason-lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px;font-weight:600}
  .vd-reason{font-size:14px;line-height:1.75;color:#c9d5e3;border-left:2px solid var(--line-2);padding:4px 0 4px 16px}
  .vd-mod{background:var(--bg-2);border:1px solid var(--line);border-radius:13px;padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
  .vd-mod::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;opacity:.6}
  .vd-mod.vis::before{background:var(--accent)}
  .vd-mod.aud::before{background:var(--violet)}
  .vd-mod .lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-2);margin-bottom:9px;display:flex;align-items:center;gap:7px;font-weight:600}
  .vd-mod .txt{font-size:12.5px;line-height:1.65;color:var(--muted)}
  .vd-action{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:13px;background:linear-gradient(180deg,var(--flag-2),#1a0810);border:1px solid #7a2236;margin-top:14px}
  .vd-action.pass{background:linear-gradient(180deg,var(--safe-2),#081c17);border-color:#1a5a48}
  .vd-action .a-ico{font-size:24px}
  .vd-action .a-lab{font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:.5px}
  .vd-action .a-sub{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono';margin-top:3px}
  .vd-action .a-arrow{margin-left:auto;font-size:20px;color:var(--flag)}
  .vd-action.pass .a-arrow{color:var(--safe)}

  /* censor overlay */
  .censor{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s;backdrop-filter:blur(22px);background:rgba(255,61,99,.16)}
  .censor.on{opacity:1}
  .censor-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:2px;color:#fff;background:rgba(61,16,30,.85);border:1px solid var(--flag);padding:12px 22px;border-radius:11px;display:flex;align-items:center;gap:10px;box-shadow:0 0 40px -6px var(--flag)}
  .censor-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--flag);letter-spacing:1px;margin-top:6px;text-align:center}
  /* enforced playback controls */
  .viewtoggle{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .viewtoggle button{font-family:'IBM Plex Mono';font-size:11.5px;padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:.15s;letter-spacing:.5px}
  .viewtoggle button.act{background:var(--accent);color:#fff}
  .viewtoggle button.act.enforced{background:var(--flag)}
  .bleep-tag{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);z-index:6;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:#fff;background:rgba(61,16,30,.9);border:1px solid var(--flag);padding:6px 14px;border-radius:8px;letter-spacing:1px;animation:fade .15s;box-shadow:0 0 24px -6px var(--flag)}
  /* HITL review queue */
  .hitl{padding:18px 22px;display:flex;flex-direction:column;gap:13px}
  .hitl-empty{padding:22px;text-align:center;color:var(--muted-2);font-family:'IBM Plex Mono';font-size:12px}
  .rev-card{border:1px solid #8a6a1e;border-radius:13px;overflow:hidden;background:linear-gradient(180deg,rgba(255,194,77,.06),var(--panel-2))}
  .rev-card.resolved{border-color:var(--line);background:var(--panel-2);opacity:.7}
  .rev-h{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .rev-h .pri{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,194,77,.12);border:1px solid #8a6a1e}
  .rev-h .rt{font-family:'Space Grotesk';font-weight:600;font-size:14px}
  .rev-h .rtag{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1px;padding:4px 9px;border-radius:6px;background:rgba(255,194,77,.12);color:var(--warn);border:1px solid #8a6a1e}
  .rev-body{padding:13px 16px;display:flex;flex-direction:column;gap:8px}
  .rev-row{display:flex;gap:12px;font-family:'IBM Plex Mono';font-size:12px}
  .rev-row .k{color:var(--muted-2);min-width:96px;text-transform:uppercase;letter-spacing:1px;font-size:10px;padding-top:1px}
  .rev-row .v{color:var(--ink);flex:1;line-height:1.5}
  .rev-actions{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line)}
  .rev-btn{font-family:'Space Grotesk';font-weight:600;font-size:12px;border-radius:9px;padding:9px 14px;cursor:pointer;border:1px solid var(--line-2);background:var(--panel-3);color:var(--ink);transition:.15s}
  .rev-btn:hover{filter:brightness(1.15)}
  .rev-btn.confirm{border-color:#7a2236;background:var(--flag-2);color:var(--flag)}
  .rev-btn.approve{border-color:#1a5a48;background:var(--safe-2);color:var(--safe)}
  .rev-btn.escalate{border-color:#8a6a1e;background:rgba(255,194,77,.1);color:var(--warn)}
  .rev-resolved-tag{font-family:'IBM Plex Mono';font-size:11px;padding:8px 14px;letter-spacing:1px}
  .rev-resolved-tag.confirmed{color:var(--flag)} .rev-resolved-tag.approved{color:var(--safe)} .rev-resolved-tag.escalated{color:var(--warn)}
  /* ban report */
  .banreport{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .banrep{border:1px solid #7a2236;border-radius:13px;overflow:hidden;background:linear-gradient(180deg,var(--flag-2),#160810)}
  .banrep-h{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid #7a2236;background:rgba(255,61,99,.06)}
  .banrep-h .seal{width:30px;height:30px;border-radius:8px;background:var(--flag-2);border:1px solid var(--flag);display:flex;align-items:center;justify-content:center;font-size:15px}
  .banrep-h .rt{font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.5px}
  .banrep-h .rid{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);margin-left:auto}
  .banrep-body{padding:14px 16px;display:flex;flex-direction:column;gap:9px}
  .banrep-row{display:flex;gap:12px;font-family:'IBM Plex Mono';font-size:12px}
  .banrep-row .k{color:var(--muted-2);min-width:108px;text-transform:uppercase;letter-spacing:1px;font-size:10px;padding-top:1px}
  .banrep-row .v{color:var(--ink);flex:1}
  .banrep-row .v .chip{display:inline-block;background:var(--flag-2);color:var(--flag);border:1px solid #7a2236;border-radius:5px;padding:1px 7px;margin:0 4px 4px 0;font-size:11px}
  .banrep-empty{padding:22px;text-align:center;color:var(--muted-2);font-family:'IBM Plex Mono';font-size:12px}
  /* audio toggle */
  .audio-btn{position:absolute;top:16px;right:16px;z-index:5;width:38px;height:38px;border-radius:10px;background:rgba(5,8,13,.8);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .audio-btn:hover{border-color:var(--accent)}
  /* action log */
  .actionlog{padding:16px 20px;display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto}
  .actentry{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:'IBM Plex Mono';font-size:12px;animation:slideIn .35s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .actentry .adot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .actentry.takedown{border-color:#7a2236}.actentry.takedown .adot{background:var(--flag);box-shadow:0 0 8px var(--flag)}
  .actentry.review{border-color:#8a6a1e}.actentry.review .adot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .actentry.safe{border-color:#1a5a48}.actentry.safe .adot{background:var(--safe);box-shadow:0 0 8px var(--safe)}
  .actentry .atime{color:var(--muted-2)}
  .actentry .alabel{font-weight:600;color:var(--ink)}
  .actentry .aaction{margin-left:auto;color:var(--muted)}
  .actentry.takedown .aaction{color:var(--flag)}
  .actentry.review .aaction{color:var(--warn)}
  .actentry.safe .aaction{color:var(--safe)}
  .actlog-empty{padding:20px;text-align:center;color:var(--muted-2);font-family:'IBM Plex Mono';font-size:12px}
  .fade-in{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
</style>

<body>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-glow-1"></div>
<div class="bg-layer bg-glow-2"></div>
<div id="root"></div>
<script type="text/jsx-source" id="appsrc">
const {useState,useEffect,useRef} = React;
const API = (function(){ return window.location.pathname.replace(/\/$/,""); })();

const AGENTS=[
  {key:"perception",name:"Perception",ico:"👁",states:{idle:"standby",on:"analyzing frames + audio",done:"perception complete"}},
  {key:"policy",name:"Policy",ico:"⚖",states:{idle:"standby",on:"evaluating against rulebook",done:"verdict reached"}},
  {key:"action",name:"Action",ico:"🛡",states:{idle:"standby",on:"applying decision matrix",done:"action executed"}},
];

function App(){
  const [clips,setClips]=useState([]);
  const [clipPath,setClipPath]=useState("");
  const [meta,setMeta]=useState({duration:0,total:0});
  const [running,setRunning]=useState(false);
  const [done,setDone]=useState(false);
  const [results,setResults]=useState([]);
  const [activeSeg,setActiveSeg]=useState(null);
  const [selected,setSelected]=useState(null);
  const [agentStage,setAgentStage]=useState(-1);
  const [gpu,setGpu]=useState({pct:0,used:0,total:206});
  const [online,setOnline]=useState(true);
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");
  const [started,setStarted]=useState(false);
  const [uploading,setUploading]=useState(false);
  const esRef=useRef(null);
  const videoRef=useRef(null);
  const [audioOn,setAudioOn]=useState(true);
  const [censoring,setCensoring]=useState(false);
  const [viewMode,setViewMode]=useState("analyze");   // "analyze" | "enforced"
  const [bleepWord,setBleepWord]=useState("");
  const [reviewDecisions,setReviewDecisions]=useState({}); // {segIndex: "confirmed"|"approved"|"escalated"}
  const fileRef=useRef(null);

  function loadClips(selectName){
    return fetch(API+"/clips").then(r=>r.json()).then(d=>{
      const cs=d.clips||[];cs.sort((a,b)=>a.name.localeCompare(b.name));setClips(cs);
      let pick;
      if(selectName)pick=cs.find(c=>c.name===selectName);
      if(!pick)pick=cs.find(c=>c.name.includes("villain"))||cs[0];
      if(pick){setClipPath(pick.path);setMeta({duration:pick.duration_sec,total:0})}
      return cs;
    });
  }

  useEffect(()=>{
    loadClips().catch(()=>{setOnline(false);setErr("Cannot reach backend /clips. Is backend.py running on port 9000?")});
    const poll=()=>fetch(API+"/gpu").then(r=>r.json()).then(d=>{
      if(d.vram_pct!=null){setGpu({pct:d.vram_pct,used:d.vram_used_gb,total:d.vram_total_gb});setOnline(true)}
    }).catch(()=>setOnline(false));
    poll();const t=setInterval(poll,2500);return()=>clearInterval(t);
  },[]);

  const selectedClip = clips.find(c=>c.path===clipPath);
  const total = meta.total || (selectedClip?Math.ceil(selectedClip.duration_sec/10):0);
  const shown = selected!=null ? results.find(r=>r.index===selected) : results[results.length-1];
  const flaggedCount=results.filter(r=>r.verdict.violation).length;
  const totalTokens=results.reduce((s,r)=>s+r.metrics.tokens,0);
  const avgLat=results.length?(results.reduce((s,r)=>s+r.metrics.total,0)/results.length):0;

  const villainClip = clips.find(c=>c.name.includes("villain"));
  const tedClip = clips.find(c=>c.name.includes("ted"));
  const isHarm = selectedClip && selectedClip.name.includes("villain");
  const isSafe = selectedClip && selectedClip.name.includes("ted");

  function reset(keepInfo){
    if(esRef.current){esRef.current.close();esRef.current=null}
    setRunning(false);setDone(false);setResults([]);setSelected(null);setActiveSeg(null);setAgentStage(-1);setErr("");if(!keepInfo)setInfo("");setStarted(false);setViewMode("analyze");setBleepWord("");setReviewDecisions({});
    if(videoRef.current){videoRef.current.pause();videoRef.current.currentTime=0}
  }

  function clipLabel(name){
    const n=(name||"").toLowerCase();
    if(n.includes("scenario")) return "Hate-speech arc";
    if(n.includes("villain")) return "Villain monologue";
    if(n.includes("tedtalk")||n.includes("ted")) return "TED talk";
    if(n.includes("gun")) return "Weapon scene";
    if(n==="h1.mp4"||n.startsWith("h1")) return "Profanity clip";
    return (name||"").replace(/\.mp4$/i,"").replace(/[_-]+/g," ");
  }
  function pick(path){
    reset();
    const c=clips.find(x=>x.path===path);
    setClipPath(path);setMeta({duration:c?c.duration_sec:0,total:0});
  }

  function run(){
    if(!clipPath){setErr("No clip selected.");return}
    reset();setRunning(true);setStarted(true);
    setTimeout(()=>{if(videoRef.current){videoRef.current.currentTime=0;videoRef.current.play().catch(()=>{})}},100);
    const url=API+"/stream?video_path="+encodeURIComponent(clipPath)+"&segment_len=10";
    const es=new EventSource(url);esRef.current=es;
    es.addEventListener("start",ev=>{const d=JSON.parse(ev.data);setMeta({duration:d.duration_sec,total:d.total_segments});setActiveSeg(0);cascade()});
    es.addEventListener("segment",ev=>{
      const d=JSON.parse(ev.data);
      const seg={index:d.index,start:d.start_sec,end:d.end_sec,visual:d.visual,audio:d.audio,words:d.words||[],flaggedFrameTimes:d.flagged_frame_times||[],frameTimes:d.frame_times||[],sceneMode:d.scene_mode||"",
        verdict:{violation:d.verdict.violation,policy_id:d.verdict.policy_id,policy_name:d.verdict.policy_name,violatingPhrase:d.verdict.violating_phrase||null,visualViolation:d.verdict.visual_violation||false,audioViolation:d.verdict.audio_violation||false,
          category:(d.verdict.category||"").split("&")[0].split("/")[0].trim().toUpperCase(),
          severity:d.verdict.severity,confidence:d.verdict.confidence||0,interplay:d.verdict.interplay_rule_applied,reasoning:d.verdict.reasoning,retrieved:d.verdict._retrieved_policies||[],nTotal:d.verdict._n_policies_total||0},
        action:(d.decision&&d.decision.action)||"PASS",queuedForReview:(d.decision&&d.decision.queued_for_review)||false,needsRecheck:(d.decision&&d.decision.needs_recheck)||false,
        metrics:{perception:d.metrics.perception_sec,policy:d.metrics.policy_sec,tokens:(d.metrics.tokens&&d.metrics.tokens.total)||0,total:d.metrics.total_sec}};
      setResults(prev=>[...prev,seg]);setActiveSeg(d.index+1);setAgentStage(-1);setTimeout(cascade,120);
    });
    es.addEventListener("done",ev=>{
      const d=JSON.parse(ev.data);es.close();esRef.current=null;setActiveSeg(null);setAgentStage(-1);setRunning(false);setDone(true);
      if(videoRef.current)videoRef.current.pause();
      // smooth demo nudge: suggest running the other clip
    });
    es.onerror=()=>{es.close();esRef.current=null;setRunning(false);if(results.length===0)setErr("Stream failed. Check the backend is running and your GROQ_API_KEY in .env is valid.")};
  }
  function cascade(){setAgentStage(0);setTimeout(()=>setAgentStage(1),550);setTimeout(()=>setAgentStage(2),1100);setTimeout(()=>setAgentStage(3),1650)}

  function onUpload(e){
    const file=e.target.files[0];if(!file)return;
    setUploading(true);setErr("");
    const fd=new FormData();fd.append("file",file);
    fetch(API+"/upload",{method:"POST",body:fd}).then(r=>r.json()).then(d=>{
      setUploading(false);
      if(d.path){loadClips(d.name).then(()=>{pick(d.path)});}
      else setErr("Upload failed: "+(d.error||"unknown"));
    }).catch(()=>{setUploading(false);setErr("Upload failed — is the backend reachable?")});
  }

  // BLEEP WORDLIST — profanity + threat/violence terms
  const BLEEP = ["fuck","fucking","fucked","shit","bitch","ass","asshole","bastard","dick","cunt","damn",
                 "kill","killed","killing","dead","death","die","died","murder","murdered","destroy","destruction",
                 "extinction","slaughter","shoot","gun","blood","attack","bomb"];
  function isBleep(word){
    const w=(word||"").toLowerCase().replace(/[^a-z]/g,"");
    return BLEEP.includes(w);
  }
  // PRECISE VISUAL: blur windows around flagged FRAME timestamps (not whole segment)
  // blur from a flagged frame until the NEXT sampled frame (or segment end)
  const blurWindows = [];
  results.filter(r=>r.verdict.violation && r.verdict.visualViolation).forEach(r=>{
    const flagged = (r.flaggedFrameTimes||[]);
    const allTimes = (r.frameTimes||[]).slice().sort((a,b)=>a-b);
    if(flagged.length>0){
      flagged.forEach(ft=>{
        // find the next sampled frame strictly after ft
        const next = allTimes.find(t=>t>ft+0.01);
        const end = (next!==undefined) ? next : r.end;  // else segment end
        blurWindows.push({start:ft, end:end, seg:r.index});
      });
    } else {
      // visual-only flag with no specific frame → whole segment
      blurWindows.push({start:r.start, end:r.end, seg:r.index});
    }
  });

  // PRECISE AUDIO: bleep the exact violating-phrase words (match phrase tokens to
  // Whisper word timestamps); fall back to wordlist if no phrase matched.
  function phraseTokens(phrase){
    return (phrase||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  }
  const bleepWords = [];
  results.filter(r=>r.verdict.violation && r.verdict.audioViolation).forEach(r=>{
    const toks = phraseTokens(r.verdict && r.verdict.violatingPhrase);
    const tokSet = new Set(toks);
    let matchedAny = false;
    (r.words||[]).forEach(w=>{
      const clean = (w.word||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      if(tokSet.has(clean)){ bleepWords.push({...w, seg:r.index}); matchedAny=true; }
    });
    // fallback: if phrase produced no matches, use the threat/profanity wordlist
    if(!matchedAny){
      (r.words||[]).forEach(w=>{ if(isBleep(w.word)) bleepWords.push({...w, seg:r.index}); });
    }
  });

  // group bleep words per segment into one continuous span + the phrase text
  const bleepSpans = [];
  results.filter(r=>r.verdict.violation && r.verdict.audioViolation).forEach(r=>{
    const ws = bleepWords.filter(w=>w.seg===r.index);
    if(ws.length>0){
      const start = Math.min(...ws.map(w=>w.start));
      const end = Math.max(...ws.map(w=>w.end));
      const phrase = (r.verdict.violatingPhrase||ws.map(w=>w.word).join(" ")).replace(/\s+/g," ").trim();
      bleepSpans.push({start, end, phrase, seg:r.index});
    }
  });

  // playback watcher — behaviour depends on viewMode
  useEffect(()=>{
    const v=videoRef.current; if(!v) return;
    function onTime(){
      const t=v.currentTime;
      if(viewMode==="enforced"){
        // precise visual: blur only near flagged frame timestamps
        const inBlur = blurWindows.some(b=>t>=b.start && t<=b.end);
        setCensoring(inBlur);
        // precise audio: mute across the whole phrase span; show stable phrase tag
        const span = bleepSpans.find(s=>t>=s.start-0.05 && t<=s.end+0.05);
        if(span){ v.muted=true; setBleepWord(span.phrase); }
        else { v.muted = !audioOn; setBleepWord(""); }
      } else {
        // analyze pass: no censoring, audio plays clean (honest)
        setCensoring(false); setBleepWord(""); v.muted = !audioOn;
      }
    }
    v.addEventListener("timeupdate",onTime);
    return ()=>v.removeEventListener("timeupdate",onTime);
  },[results,audioOn,viewMode]);

  useEffect(()=>{ if(videoRef.current){ videoRef.current.muted = !audioOn; } },[audioOn]);

  const lineFill = agentStage<0?0:agentStage>=3?100:(agentStage/2)*100;
  function playMode(mode){
    setViewMode(mode);
    const v=videoRef.current; if(v){ v.currentTime=0; v.play().catch(()=>{}); }
  }
  const videoSrc = clipPath?API+"/video?path="+encodeURIComponent(clipPath):"";

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark"></div>
          <div><div className="brand-name">SENTI<b>NEL</b></div><div className="brand-sub">Agentic Multimodal Moderation</div></div>
        </div>
        <div className="topbar-spacer"></div>
        <div className="stat-chip"><span className={"dot "+(online?"live":"off")}></span><span className="lbl">Groq</span> gpt-oss-120b · Qwen3.8 · Whisper</div>
        <div className="stat-chip gpu-chip"><span className="lbl">API calls</span><div className="meter"><i style={{width:gpu.pct+"%"}}></i></div><span style={{color:"var(--ink)"}}>{gpu.pct?gpu.pct.toFixed(0):"–"}</span></div>
      </div>

      <div className="wrap">
        <div className={"banner err"+(err?" show":"")}>⚠ {err}</div>
        <div className={"banner info"+(running&&!err?" show":"")}>{running?(agentStage<0?"Initializing pipeline…":agentStage<1?"Perception — analyzing frames + audio…":agentStage<2?"Policy — evaluating against rulebook…":agentStage<3?"Action — applying decision matrix…":"Finalizing…"):""}</div>

        {/* CLIP PICKER */}
        <div className="picker">
          <div className="clip-select-wrap">
            <label className="clip-select-label">Source Clip</label>
            <div className="clip-select-shell">
              <select className="clip-select" value={clipPath} onChange={(e)=>e.target.value&&pick(e.target.value)}>
                <option value="">Select a clip to analyze…</option>
                {clips.filter(c=>!c.name.toLowerCase().includes("vidharm")).map(c=>(
                  <option key={c.path} value={c.path}>{clipLabel(c.name)} · {Math.round(c.duration_sec)}s</option>
                ))}
              </select>
              <span className="clip-select-caret">▾</span>
            </div>
          </div>
          <button className="upload-btn" onClick={()=>fileRef.current&&fileRef.current.click()}>
            <span className="upload-btn-ico">{uploading?"⏳":"⬆"}</span>
            <span className="upload-btn-txt">{uploading?"Uploading…":"Upload clip"}</span>
            <input ref={fileRef} type="file" accept="video/*" style={{display:"none"}} onChange={onUpload}/>
          </button>
        </div>

        {/* HERO */}
        <div className="hero">
          <div className="card">
            <div className="card-h"><span className="ey">Source Feed</span><span className="ix">{selectedClip?selectedClip.name:"—"}</span></div>
            <div className={"screen"+(running?" scanning":"")}>
              {videoSrc && <video ref={videoRef} src={videoSrc} playsInline preload="auto" style={{opacity:started?1:.25}}></video>}
              <div className="scan-tint"></div>
              <div className="screen-vignette"></div>
              <div className="reticle tl"></div><div className="reticle tr"></div><div className="reticle bl"></div><div className="reticle br"></div>
              {!started && <div className="frame-art">🎬</div>}
              <div className="scanline"></div>
              <div className={"censor"+(censoring&&viewMode==="enforced"?" on":"")}>
                <div className="censor-label">⊘ CONTENT CENSORED
                </div>
                <div style={{position:"absolute",top:"calc(50% + 34px)",left:"50%",transform:"translateX(-50%)"}} className="censor-sub">AUTO_TAKEDOWN · audio muted</div>
              </div>
              {started && <button className="audio-btn" title="toggle audio" onClick={()=>setAudioOn(a=>!a)}>{audioOn?"🔊":"🔇"}</button>}
              {bleepWord && viewMode==="enforced" && <div className="bleep-tag">🔇 BLEEPED: "{bleepWord.length>60?bleepWord.slice(0,60)+"…":bleepWord}"</div>}
              {done && <div style={{position:"absolute",bottom:16,right:16,zIndex:6}} className="viewtoggle">
                <button className={viewMode==="analyze"?"act":""} onClick={()=>playMode("analyze")}>ORIGINAL</button>
                <button className={viewMode==="enforced"?"act enforced":""} onClick={()=>playMode("enforced")}>ENFORCED VIEW</button>
              </div>}
              <div className="screen-tag">CLIP · {meta.duration||(selectedClip&&selectedClip.duration_sec)||0}s · {total||"?"} SEGMENTS</div>
              {!running && !done &&
                <div className="play-cta" onClick={run}>
                  <div className="play-btn"><div className="play-tri"></div></div>
                  <div className="play-label">Press to <b>run moderation</b></div>
                </div>}
              {running && <div className="screen-status" style={{background:"var(--accent-2)",color:"var(--accent)",border:"1px solid #25406e"}}>
                <span className="dot" style={{width:7,height:7,borderRadius:"50%",background:"var(--accent)",boxShadow:"0 0 8px var(--accent)"}}></span>SCANNING SEGMENT {(activeSeg||0)+1}{total?" / "+total:""}</div>}
              {done && flaggedCount>0 && <div className="screen-status" style={{background:"var(--flag-2)",color:"var(--flag)",border:"1px solid #7a2236"}}>⚠ {flaggedCount} VIOLATION{flaggedCount>1?"S":""} DETECTED</div>}
              {done && flaggedCount===0 && <div className="screen-status" style={{background:"var(--safe-2)",color:"var(--safe)",border:"1px solid #1a5a48"}}>✓ ALL CLEAR — NO VIOLATIONS</div>}
            </div>
          </div>

          <div className="card">
            <div className="card-h"><span className="ey">Agent Pipeline</span><span className="ix">LangGraph · 3 agents</span></div>
            <div className="agents">
              <div className="agent-line"><i style={{height:lineFill+"%"}}></i></div>
              {AGENTS.map((a,i)=>{const state=agentStage===-1?"idle":(agentStage>i?"done":(agentStage===i?"on":"idle"));
                return (<div key={a.key} className={"agent "+(state==="on"?"on":state==="done"?"done":"")}>
                  <div className="agent-ico">{a.ico}</div>
                  <div className="agent-body"><div className="agent-name">{a.name} Agent</div><div className="agent-state">{a.states[state]}</div></div>
                  <div className="agent-tick">{state==="done"?"✓":state==="on"?"●":"○"}</div></div>);})}
            </div>
          </div>
        </div>

        {/* ACTION LOG */}
        <div className="card" style={{marginBottom:24}}>
          <div className="card-h"><span className="ey">Live Action Stream</span><span className="ix">real-time agent decisions</span></div>
          {results.length===0
            ? <div className="actlog-empty">No actions yet. Run moderation to see live takedown / review / pass decisions stream in.</div>
            : <div className="actionlog">
                {results.map(r=>{
                  const act=r.action||"PASS";
                  const cls = act.includes("TAKEDOWN")?"takedown":(act.includes("REVIEW")?"review":"safe");
                  const verb = act.includes("TAKEDOWN")?"content censored":(act.includes("REVIEW")?"queued for human review":"passed — safe");
                  return (<div key={r.index} className={"actentry "+cls}>
                    <span className="adot"></span>
                    <span className="atime">{String(r.start).padStart(2,'0')}–{Math.round(r.end)}s</span>
                    <span className="alabel">{r.verdict.violation?r.verdict.policy_id:"NO VIOLATION"}</span>
                    <span className="aaction">{act.replace(/_/g,' ')} · {verb}</span>
                  </div>);
                })}
              </div>}
        </div>

        {/* HITL REVIEW QUEUE */}
        <div className="card" style={{marginBottom:24}}>
          <div className="card-h"><span className="ey">Human Review Queue</span>
            <span className="ix">{results.filter(r=>r.queuedForReview && !reviewDecisions[r.index]).length} pending · human-in-the-loop</span></div>
          {results.filter(r=>r.queuedForReview).length===0
            ? <div className="hitl-empty">No items awaiting human review. Segments the AI flags with lower confidence or MEDIUM severity are routed here for a human moderator.</div>
            : <div className="hitl">
                {results.filter(r=>r.queuedForReview).map(r=>{
                  const decision = reviewDecisions[r.index];
                  const pri = r.action==="URGENT_HUMAN_REVIEW" ? "URGENT" : (r.action==="LOW_PRIORITY_REVIEW" ? "LOW PRIORITY" : "STANDARD");
                  return (<div key={r.index} className={"rev-card"+(decision?" resolved":"")}>
                    <div className="rev-h">
                      <div className="pri">⚖</div>
                      <div className="rt">Segment {r.index+1} — Review Required</div>
                      <div className="rtag">{pri}</div>
                    </div>
                    <div className="rev-body">
                      <div className="rev-row"><div className="k">Policy</div><div className="v">{r.verdict.policy_id||"—"} · {r.verdict.severity} · {(r.verdict.confidence*100).toFixed(0)}% confidence</div></div>
                      <div className="rev-row"><div className="k">Timestamp</div><div className="v">{r.start}s – {Math.round(r.end)}s</div></div>
                      <div className="rev-row"><div className="k">AI Reasoning</div><div className="v" style={{color:"var(--muted)"}}>{r.verdict.reasoning}</div></div>
                      {r.audio && <div className="rev-row"><div className="k">Audio</div><div className="v" style={{color:"var(--muted)"}}>"{r.audio.slice(0,120)}"</div></div>}
                    </div>
                    {decision
                      ? <div className={"rev-resolved-tag "+decision}>✓ {decision==="confirmed"?"TAKEDOWN CONFIRMED by reviewer":decision==="approved"?"APPROVED — content allowed by reviewer":"ESCALATED to senior moderator"}</div>
                      : <div className="rev-actions">
                          <button className="rev-btn confirm" onClick={()=>setReviewDecisions(p=>({...p,[r.index]:"confirmed"}))}>🚫 Confirm Takedown</button>
                          <button className="rev-btn approve" onClick={()=>setReviewDecisions(p=>({...p,[r.index]:"approved"}))}>✓ Approve Content</button>
                          <button className="rev-btn escalate" onClick={()=>setReviewDecisions(p=>({...p,[r.index]:"escalated"}))}>↑ Escalate</button>
                        </div>}
                  </div>);
                })}
              </div>}
        </div>

        {/* BAN REPORT */}
        <div className="card" style={{marginBottom:24}}>
          <div className="card-h"><span className="ey">Ban Reports</span><span className="ix">auto-generated · policy citations</span></div>
          {results.filter(r=>r.verdict.violation).length===0
            ? <div className="banrep-empty">No violations recorded. Ban reports are generated automatically when content is taken down.</div>
            : <div className="banreport">
                {results.filter(r=>r.verdict.violation).map(r=>{
                  const segWords=(r.words||[]).filter(w=>isBleep(w.word)).map(w=>w.word.replace(/[^a-zA-Z]/g,""));
                  return (<div key={r.index} className="banrep">
                    <div className="banrep-h"><div className="seal">🚫</div><div className="rt">Content Takedown — Segment {r.index+1}</div><div className="rid">REPORT #SNL-{String(r.index+1).padStart(3,'0')}</div></div>
                    <div className="banrep-body">
                      <div className="banrep-row"><div className="k">Policy</div><div className="v">{r.verdict.policy_id} — {r.verdict.policy_name}</div></div>
                      <div className="banrep-row"><div className="k">Severity</div><div className="v">{r.verdict.severity} · confidence {(r.verdict.confidence*100).toFixed(0)}%</div></div>
                      {r.verdict.interplay && <div className="banrep-row"><div className="k">Interplay</div><div className="v">{r.verdict.interplay} (cross-modal)</div></div>}
                      <div className="banrep-row"><div className="k">Timestamp</div><div className="v">{r.start}s – {Math.round(r.end)}s</div></div>
                      <div className="banrep-row"><div className="k">Action</div><div className="v">{r.action.replace(/_/g,' ')}</div></div>
                      <div className="banrep-row"><div className="k">Visual</div><div className="v">{r.verdict.visualViolation
                        ? <span style={{color:"var(--flag)"}}>CENSORED — frame(s) flagged at {(r.flaggedFrameTimes||[]).map(t=>t+"s").join(", ")||"segment"}; blurred in enforced playback.</span>
                        : <span style={{color:"var(--muted)"}}>not a visual violation — video left clear.</span>}</div></div>
                      <div className="banrep-row"><div className="k">Audio</div><div className="v">{r.verdict.audioViolation
                        ? <span style={{color:"var(--flag)"}}>BLEEPED — violating phrase: "{r.verdict.violatingPhrase||(segWords.join(' '))}"</span>
                        : <span style={{color:"var(--muted)"}}>not an audio violation — audio left clear.</span>}</div></div>
                      <div className="banrep-row"><div className="k">Reason</div><div className="v" style={{lineHeight:1.6,color:"var(--muted)"}}>{r.verdict.reasoning}</div></div>
                    </div>
                  </div>);
                })}
              </div>}
        </div>

        {/* TIMELINE */}
        <div className="card timeline-card">
          <div className="card-h"><span className="ey">Moderation Timeline</span><span className="ix">{results.length}/{total||"?"} analyzed · click a segment to inspect</span></div>
          <div className="timeline-wrap">
            <div className="tl-labels"><span>0:00</span><span className="mid">◈ SEGMENT MAP</span><span>0:{meta.duration||(selectedClip&&selectedClip.duration_sec)||0}</span></div>
            <div className="tl">
              {Array.from({length:Math.max(total,1)}).map((_,i)=>{
                const r=results.find(x=>x.index===i);let cls="pending";
                if(r)cls=(r.verdict.violation?"flag":"safe")+(selected===i?" sel":"")+" clickable";
                else if(activeSeg===i&&running)cls="active pending";
                return (<div key={i} className={"seg "+cls} onClick={()=>r&&setSelected(i)}>
                  <span className="tnum">{String(i+1).padStart(2,'0')}</span>
                  {r && <span className="ico">{r.verdict.violation?"⚠":"✓"}</span>}
                  {r && <span className="trange">{r.start}-{Math.round(r.end)}s</span>}
                  <span className="sev"></span></div>);})}
            </div>
          </div>
          <div className="controls">
            <div className="clip-now">Active clip: <b>{selectedClip?selectedClip.name:"none"}</b>{selectedClip?` · ${selectedClip.duration_sec}s`:""}</div>
            {done && <button className="btn-ghost" onClick={()=>reset()}>Clear</button>}
            {!done
              ? <button className="btn-run" onClick={run} disabled={running||!clipPath}>{running?<React.Fragment><span className="spin-i"></span>Running…</React.Fragment>:<React.Fragment>▶ Run Moderation</React.Fragment>}</button>
              : <button className="btn-run" onClick={run}>↻ Run Again</button>}
          </div>
        </div>

        {/* METRICS */}
        <div className="metrics-row">
          <div className="metric-card c1"><div className="mlabel">Segments</div><div className="mval">{results.length}<span style={{color:"var(--muted-2)",fontSize:20}}>/{total||"?"}</span></div><div className="msub">processed</div></div>
          <div className="metric-card c2"><div className="mlabel">Violations</div><div className="mval" style={{color:flaggedCount?"var(--flag)":"var(--ink)"}}>{flaggedCount}</div><div className="msub">flagged for action</div></div>
          <div className="metric-card c3"><div className="mlabel">Tokens</div><div className="mval">{totalTokens.toLocaleString()}</div><div className="msub">policy reasoning</div></div>
          <div className="metric-card c4"><div className="mlabel">Avg Latency</div><div className="mval">{avgLat.toFixed(1)}<span style={{fontSize:20,color:"var(--muted-2)"}}>s</span></div><div className="msub">per segment</div></div>
        </div>

        {/* VERDICT */}
        <div className="card verdict-card">
          <div className="card-h"><span className="ey">Verdict Detail</span><span className="ix">{shown?`segment ${shown.index+1} · ${shown.start}–${Math.round(shown.end)}s`:"awaiting analysis"}</span></div>
          {!shown ? (
            <div className="verdict empty"><div className="empty-ico">◎</div><div>No verdict yet.<br/>Pick a clip above, run moderation, then click any segment to inspect its analysis.</div></div>
          ) : (
            <div className="verdict fade-in" key={shown.index}>
              <div className="vd-top">
                <span className={"vd-badge "+(shown.verdict.violation?"flag":"safe")}><span className="bdot"></span>{shown.verdict.violation?"VIOLATION":"CLEAR"}</span>
                <span className="vd-sev">SEVERITY · {shown.verdict.severity}</span>
              </div>
              <div className="vd-grid">
                <div>
                  {shown.verdict.violation ? (
                    <React.Fragment>
                      <div className="vd-policy">{shown.verdict.policy_id}{shown.verdict.category&&<span className="cat">{shown.verdict.category}</span>}</div>
                      <div className="vd-policy-name">{shown.verdict.policy_name}</div>
                      <div className="vd-conf">
                        <div className="vd-conf-lab"><span>CONFIDENCE</span><b>{(shown.verdict.confidence*100).toFixed(0)}%</b></div>
                        <div className="vd-conf-bar"><i style={{width:(shown.verdict.confidence*100)+"%"}}></i></div>
                      </div>
                      {shown.verdict.retrieved && shown.verdict.retrieved.length>0 && <div className="vd-rag">
                      <div className="vd-rag-h">◈ RAG Policy Retrieval <span className="cnt">{shown.verdict.retrieved.length} of {shown.verdict.nTotal} policies</span></div>
                      <div className="vd-rag-chips">
                        {shown.verdict.retrieved.map(pid=><span key={pid} className={"rag-chip"+(pid===shown.verdict.policy_id?" hit":"")}>{pid}</span>)}
                      </div>
                    </div>}
                    {shown.verdict.interplay && <div className="vd-interplay"><span className="gem">◆</span>{shown.verdict.interplay} — cross-modal rule applied</div>}
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <div className="vd-policy" style={{color:"var(--safe)"}}>No Violation</div>
                      <div className="vd-policy-name">Content passed all policy checks</div>
                    </React.Fragment>
                  )}
                  <div className="vd-reason-lab">Reasoning</div>
                  <div className="vd-reason">{shown.verdict.reasoning}</div>
                  <div className={"vd-action"+(shown.verdict.violation?"":" pass")}>
                    <span className="a-ico">{shown.verdict.violation?"🚫":"✓"}</span>
                    <div><div className="a-lab">{shown.action.replace(/_/g," ")}</div><div className="a-sub">decision matrix · {shown.metrics.total}s · {shown.metrics.tokens.toLocaleString()} tokens</div></div>
                    <span className="a-arrow">→</span>
                  </div>
                </div>
                <div>
                  <div className="vd-mod vis"><div className="lab">👁 Visual Perception — Qwen3.8</div><div className="txt">{shown.visual}</div></div>
                  <div className="vd-mod aud"><div className="lab">🔊 Audio Transcript — Whisper (Groq)</div><div className="txt">{shown.audio}</div></div>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
window.addEventListener("DOMContentLoaded", function(){
  var src = document.getElementById("appsrc").textContent;
  var out = Babel.transform(src, {presets: [["react", {runtime: "classic"}]]}).code;
  var s = document.createElement("script");
  s.textContent = out;
  document.body.appendChild(s);
});
</script>
</body>
</html>
